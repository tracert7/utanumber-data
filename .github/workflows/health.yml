name: Monitor UtaNumber public data
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  workflow_run:
    workflows: [Refresh and publish UtaNumber data]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: [monitor.mjs, .github/workflows/health.yml]
permissions:
  contents: read
concurrency:
  group: utanumber-data-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check published data, schema, freshness and CORS
        run: node monitor.mjs
      - name: Keep health report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-health-${{ github.run_id }}
          path: .health/cloud-health.json
          if-no-files-found: warn
          retention-days: 14
